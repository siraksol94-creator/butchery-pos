<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Butchery Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 12px;
      animation: pulse 2s ease-in-out infinite;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #e8b84b;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8b84b55, transparent);
      margin-bottom: 18px;
    }

    .dev-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-align: center;
    }

    .dev-name {
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .dev-name .line1 {
      display: block;
      font-size: 17px;
      font-weight: 900;
      color: #e8b84b;
      letter-spacing: 4px;
    }
    .dev-name .line2 {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #c8a84b;
      letter-spacing: 1.5px;
    }

    .dev-info {
      font-size: 11px;
      color: #aaa;
      line-height: 1.9;
      text-align: center;
      letter-spacing: 0.3px;
      margin-bottom: 22px;
    }

    .loader-track {
      width: 240px;
      height: 3px;
      background: #2a2a3e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8b84b, #f0d080);
      border-radius: 2px;
      animation: fill 8s linear forwards;
    }

    .status {
      font-size: 11px;
      color: #666;
      letter-spacing: 1px;
      min-height: 16px;
    }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #252538;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes fill {
      0%   { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- App Icon (Option B — Gold Cleaver on dark circle) -->
  <svg class="icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#2a2a3e"/>
        <stop offset="100%" stop-color="#0f0f1a"/>
      </radialGradient>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0d080"/>
        <stop offset="100%" stop-color="#c8900a"/>
      </linearGradient>
    </defs>
    <!-- Dark circle -->
    <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
    <!-- Gold outer ring -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6"/>
    <!-- Cleaver blade -->
    <path d="M30 36 L78 28 L84 66 L28 72 Z" fill="url(#gold)" opacity="0.9"/>
    <!-- Blade spine highlight -->
    <path d="M30 36 L78 28 L80 33 L32 41 Z" fill="#f0d080" opacity="0.4"/>
    <!-- Handle -->
    <path d="M20 68 L30 72 L26 90 L16 86 Z" fill="#c8900a"/>
    <!-- Bolster -->
    <path d="M28 71 L32 73 L28 91 L24 89 Z" fill="#f0d080" opacity="0.7"/>
    <!-- PRO text -->
    <text x="60" y="100" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="11" font-weight="900" fill="url(#gold)" letter-spacing="3">PRO</text>
  </svg>

  <div class="title">Butchery Pro</div>
  <div class="subtitle">Management System</div>

  <div class="divider"></div>

  <div class="dev-label">Developed by</div>
  <div class="dev-name">
    <span class="line1">SIDAN</span>
    <span class="line2">IT and Business Solutions</span>
  </div>
  <div class="dev-info">
    www.sidanitsolutions.com<br>
    +260 775 722 196 &nbsp;/&nbsp; +260 775 722 228<br>
    Lusaka, Zambia
  </div>

  <div class="loader-track">
    <div class="loader-bar"></div>
  </div>
  <div class="status" id="status">Starting...</div>

  <div class="version">v1.2.8</div>
</body>
</html>
