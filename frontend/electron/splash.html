<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Butchery Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
      animation: pulse 2s ease-in-out infinite;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #e8b84b;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8b84b55, transparent);
      margin-bottom: 18px;
    }

    .dev-label {
      font-size: 10px;
      color: #3a3a5a;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-align: center;
    }

    .dev-name {
      font-size: 13px;
      font-weight: 700;
      color: #c8a84b;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .dev-info {
      font-size: 11px;
      color: #3a3a5a;
      line-height: 1.9;
      text-align: center;
      letter-spacing: 0.3px;
      margin-bottom: 22px;
    }

    .loader-track {
      width: 240px;
      height: 3px;
      background: #2a2a3e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8b84b, #f0d080);
      border-radius: 2px;
      animation: fill 5s linear forwards;
    }

    .status {
      font-size: 11px;
      color: #3a3a5a;
      letter-spacing: 1px;
      min-height: 16px;
    }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #252538;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes fill {
      0%   { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="icon">🥩</div>
  <div class="title">Butchery Pro</div>
  <div class="subtitle">Management System</div>

  <div class="divider"></div>

  <div class="dev-label">Developed by</div>
  <div class="dev-name">SIDANIT and Business Solutions</div>
  <div class="dev-info">
    www.sidanitsolutions.com<br>
    +260 775 722 196 &nbsp;/&nbsp; +260 775 722 228<br>
    Lusaka, Zambia
  </div>

  <div class="loader-track">
    <div class="loader-bar"></div>
  </div>
  <div class="status" id="status">Starting...</div>

  <div class="version">v1.2.4</div>
</body>
</html>
